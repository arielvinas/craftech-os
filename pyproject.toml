[project]
name = "craftech-os"
version = "0.1.0"
description = "Record of Craftech's financial commitments, mirrored from its spreadsheets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
]

[project.scripts]
craftech-os = "craftech_os.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "app"

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
