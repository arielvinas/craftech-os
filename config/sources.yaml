# Finance spreadsheets that Craftech OS mirrors, and the class of each tab.
# Source: docs/03-proposal.md, annex A. Titles and tab names are copied exactly
# as Google has them, spaces included. Only names live here, never cell values.
#
# Classes: CARGA, DERIVADA, HISTORICA, IGNORAR, A_CONFIRMAR, SIN_CLASIFICAR.
# A_CONFIRMAR: imported once, not read again until Finanzas says what it is.
# all_tabs: every tab gets that class; tabs are registered when first read (T-002).
# schemas (T-004): per CARGA tab, the header row text, the key column, the texts in
# the key column that open each block, and the month grid columns. Rows are matched
# by key inside each block; tabs without a schema are compared cell by cell by position.

